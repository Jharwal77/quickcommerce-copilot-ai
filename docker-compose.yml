name: quickcommerce-copilot

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: quickcommerce-qdrant
    restart: unless-stopped
    # Host ports are deliberately non-default: 6333 and 5432 are in use by unrelated
    # services on some machines, so this project claims its own range.
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - quickcommerce-qdrant-data:/qdrant/storage
    networks:
      - quickcommerce-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: quickcommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: darkstore
      POSTGRES_PASSWORD: darkstore
      POSTGRES_DB: darkstore
    ports:
      - "55432:5432"
    volumes:
      - quickcommerce-postgres-data:/var/lib/postgresql/data
    networks:
      - quickcommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkstore -d darkstore"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  quickcommerce-qdrant-data:
    name: quickcommerce-qdrant-data
  quickcommerce-postgres-data:
    name: quickcommerce-postgres-data

networks:
  quickcommerce-net:
    name: quickcommerce-net
