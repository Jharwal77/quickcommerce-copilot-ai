<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Agentic RAG assistant for quick-commerce catalog and operations questions. Synthetic data." />
    <meta name="color-scheme" content="dark light" />
    <title>quickcommerce-copilot</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong palette.
      try {
        const stored = localStorage.getItem("qc-theme");
        if (stored === "light") document.documentElement.classList.remove("dark");
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
